<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="UTF-8">
        <title>소프트웨어 기술 설문조사</title>
        <style>
            body {
                background-color: aliceblue;
                margin: 20px;
                padding: 10px;
            }

            header {
                border-bottom: 1px solid black;
                padding-bottom: 10px;
                margin-bottom: 20px;
            }

            h1 {
                color: brown;
                text-align: center;
            }

            p {
                font-family: "휴먼편지체", "Malgun Gothic", sans-serif;
                font-size: 1em;
                text-indent: 1em;
                line-height: 1.6;
            }

            fieldset {
                border: 1px dashed black;
                padding: 15px 20px;
                background-color: rgb(255, 240, 255);
            }

            legend {
                color: blue;
                font-size: 1.25em;
                font-weight: bold;
                text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
            }

            fieldset p {
                font-family: "휴먼편지체", "Malgun Gothic", sans-serif;
                text-indent: 0;
                margin-bottom: 15px;
            }

            textarea {
                margin-top: 5px;
                padding: 5px;
                font-family: sans-serif;
            }

            footer {
                background-color: orange;
                border-radius: 10px;
                border: 1px solid darkorange;
                padding: 15px;
                text-align: center;
                margin-top: 40px;
            }
            footer p {
                margin: 0;
                text-indent: 0;
                color: white;
                font-family: Arial, sans-serif;
                font-weight: bold;
            }
            footer a {
                color: white;
                text-decoration: none;
            }
            footer a:hover {
                text-decoration: underline;
            }
        </style>
    </head>
    <body>

        <header>
            <h1>설문지</h1>
        </header>

        <section>
            <article>
                <p>소프트웨어 기술에 대한 의견을 듣습니다. 많은 참여 부탁드립니다.</p>
                <hr>
                <form>
                    <fieldset>
                        <legend>설문지 정보</legend>
                        <p>학년: 
                            <label><input type="radio" name="grade" value="1" checked> 1학년</label>
                            <label><input type="radio" name="grade" value="2"> 2학년</label>
                            <label><input type="radio" name="grade" value="3"> 3학년</label>
                        </p>
                        <p>성별: 
                            <label><input type="radio" name="gender" value="m"> 남</label>
                            <label><input type="radio" name="gender" value="f"> 여</label>
                        </p>
                        <p>관심 분야: 
                            <select name="interest">
                                <option value="ai_eng">Ai</option>
                                <option value="ai_kor">인공지능</option>
                                <option value="security">사이버보안</option>
                                <option value="web">웹 개발</option>
                            </select>
                        </p>
                        <p>진로: 
                            <label><input type="checkbox" name="job" value="dev" checked> 개발</label>
                            <label><input type="checkbox" name="job" value="plan"> 기획</label>
                            <label><input type="checkbox" name="job" value="sales"> 영업</label>
                            <label><input type="checkbox" name="job" value="startup"> 창업</label>
                        </p>
                        <p>남기고 싶은 말:<br>
                            <textarea rows="5" cols="45" placeholder="글을 남겨주세요"></textarea>
                        </p>
                    </fieldset>
                </form>
            </article>
        </section>

        <footer>
            <p>Copyright 2026 by MYONGJI COLLEGE</p>
        </footer>

    </body>
</html>
