<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>도형 서식 폼 만들기</title>
    </head>
    <body>
        <h3>도형 서식 폼 만들기</h3>
        <hr>
        <form>
            <fieldset>
                <legend>도형 서식 입력</legend>
                
                <p>
                    선종류 
                    <select size="3">
                        <option>선없음</option>
                        <option selected>실선</option>
                        <option>점선</option>
                    </select>
                </p>

                <p>
                    선두께 <input type="number" value="1"> 
                    선색 <input type="color" value="#00A2E8">
                </p>

                <p>
                    투명도(0~100) : 
                    <input type="range" min="0" max="100">
                </p>
            </fieldset>
        </form>
    </body>
</html>
